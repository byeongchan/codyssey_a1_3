<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>학습 계획 | AI Study Coach</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- 네비게이션 -->
    <header class="header">
        <nav class="nav container">

            <a href="index.html" class="logo">
                AI Study Coach
            </a>

            <div class="nav-menu">
                <a href="index.html" class="nav-link">홈</a>
                <a href="plan.html" class="nav-link active">학습 계획</a>
                <a href="coach.html" class="nav-link">AI 코치</a>
                <a href="analysis.html" class="nav-link">학습 분석</a>
            </div>

        </nav>
    </header>


    <main>

        <!-- 페이지 소개 -->
        <section class="page-hero">
            <div class="container">

                <p class="hero-label">
                    AI STUDY PLAN
                </p>

                <h1>
                    나에게 맞는<br>
                    학습 계획을 만들어보세요.
                </h1>

                <p>
                    현재 수준과 목표를 입력하면<br>
                    AI가 맞춤형 학습 계획을 만들어드립니다.
                </p>

            </div>
        </section>


        <!-- 입력 영역 -->
        <section class="plan-section">
            <div class="container">

                <div class="plan-layout">

                    <!-- 입력 폼 -->
                    <div class="plan-form-card">

                        <div class="card-title">
                            <h2>학습 정보 입력</h2>
                            <p>
                                AI가 계획을 만들기 위해 필요한 정보를 입력해주세요.
                            </p>
                        </div>


                        <form id="plan-form">

                            <!-- 공부 분야 -->
                            <div class="form-group">

                                <label for="subject">
                                    공부할 분야
                                </label>

                                <input
                                    type="text"
                                    id="subject"
                                    name="subject"
                                    placeholder="예: Python, JavaScript, 데이터 분석"
                                    required
                                >

                            </div>


                            <!-- 현재 수준 -->
                            <div class="form-group">

                                <label for="level">
                                    현재 수준
                                </label>

                                <select id="level" name="level" required>

                                    <option value="">
                                        수준을 선택해주세요
                                    </option>

                                    <option value="초급">
                                        초급
                                    </option>

                                    <option value="중급">
                                        중급
                                    </option>

                                    <option value="고급">
                                        고급
                                    </option>

                                </select>

                            </div>


                            <!-- 학습 목표 -->
                            <div class="form-group">

                                <label for="goal">
                                    학습 목표
                                </label>

                                <textarea
                                    id="goal"
                                    name="goal"
                                    rows="4"
                                    placeholder="예: 3개월 안에 Python으로 간단한 웹 서비스를 만들고 싶어요."
                                    required
                                ></textarea>

                            </div>


                            <!-- 학습 기간 -->
                            <div class="form-group">

                                <label for="duration">
                                    학습 기간
                                </label>

                                <select id="duration" name="duration" required>

                                    <option value="">
                                        기간을 선택해주세요
                                    </option>

                                    <option value="2주">
                                        2주
                                    </option>

                                    <option value="4주">
                                        4주
                                    </option>

                                    <option value="8주">
                                        8주
                                    </option>

                                    <option value="12주">
                                        12주
                                    </option>

                                </select>

                            </div>


                            <!-- 하루 공부 시간 -->
                            <div class="form-group">

                                <label for="daily-time">
                                    하루 학습 시간
                                </label>

                                <select id="daily-time" name="daily_time" required>

                                    <option value="">
                                        시간을 선택해주세요
                                    </option>

                                    <option value="30분">
                                        30분
                                    </option>

                                    <option value="1시간">
                                        1시간
                                    </option>

                                    <option value="2시간">
                                        2시간
                                    </option>

                                    <option value="3시간 이상">
                                        3시간 이상
                                    </option>

                                </select>

                            </div>


                            <!-- 에러 메시지 -->
                            <div
                                id="form-error"
                                class="form-message error"
                                hidden
                            >
                            </div>


                            <!-- 제출 버튼 -->
                            <button
                                type="submit"
                                class="btn btn-primary plan-submit"
                            >
                                AI 학습 계획 만들기
                            </button>

                        </form>

                    </div>


                    <!-- 결과 영역 -->
                    <div class="plan-result-card">

                        <div class="result-empty" id="result-empty">

                            <div class="result-icon">
                                🤖
                            </div>

                            <h2>
                                AI 학습 계획
                            </h2>

                            <p>
                                왼쪽에 학습 정보를 입력하면<br>
                                AI가 맞춤형 계획을 만들어드립니다.
                            </p>

                        </div>


                        <!-- 로딩 -->
                        <div
                            class="result-loading"
                            id="result-loading"
                            hidden
                        >

                            <div class="loading-icon">
                                ⏳
                            </div>

                            <h2>
                                AI가 계획을 만들고 있습니다.
                            </h2>

                            <p>
                                잠시만 기다려주세요.
                            </p>

                        </div>


                        <!-- 결과 -->
                        <div
                            class="result-content"
                            id="result-content"
                            hidden
                        >

                            <h2>
                                나의 AI 학습 계획
                            </h2>

                            <div id="plan-output">
                                <!-- AI 결과가 여기에 표시됩니다. -->
                            </div>

                        </div>

                    </div>

                </div>

            </div>
        </section>

    </main>


    <!-- 푸터 -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 AI Study Coach</p>
        </div>
    </footer>


    <script src="js/plan.js"></script>

</body>
</html>
