<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>학습 분석 | AI Study Coach</title>

<link rel="stylesheet" href="css/style.css">


</head>

<body>


<header class="header">
    <nav class="nav container">

        <a href="index.html" class="logo">
            AI Study Coach
        </a>

        <div class="nav-menu">
            <a href="index.html" class="nav-link">홈</a>
            <a href="plan.html" class="nav-link">학습 계획</a>
            <a href="coach.html" class="nav-link">AI 코치</a>
            <a href="analysis.html" class="nav-link active">학습 분석</a>
        </div>

    </nav>
</header>

<main>

    <section class="page-hero">
        <div class="container">

            <p class="hero-label">
                LEARNING ANALYSIS
            </p>

            <h1>
                나의 학습 현황을<br>
                확인해보세요.
            </h1>

            <p>
                이번 주 학습 정보를 입력하면<br>
                현재 학습 진행 상황을 확인할 수 있습니다.
            </p>

        </div>
    </section>

    <section class="analysis-section">
        <div class="container">

            <div class="analysis-card">

                <div class="card-title">
                    <h2>학습 정보 입력</h2>

                    <p>
                        이번 주 학습한 내용을 입력해주세요.
                    </p>
                </div>

                <form id="analysis-form">

                    <div class="form-group">

                        <label for="study-days">
                            학습한 날짜
                        </label>

                        <input
                            type="number"
                            id="study-days"
                            min="0"
                            max="7"
                            placeholder="예: 5"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="study-hours">
                            총 학습 시간
                        </label>

                        <input
                            type="number"
                            id="study-hours"
                            min="0"
                            placeholder="예: 8"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="completed-tasks">
                            완료한 학습 항목
                        </label>

                        <input
                            type="number"
                            id="completed-tasks"
                            min="0"
                            placeholder="예: 6"
                            required
                        >

                    </div>

                    <div
                        id="analysis-error"
                        class="form-message error"
                        hidden
                    >
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary analysis-submit"
                    >
                        학습 현황 확인하기
                    </button>

                </form>

            </div>

            <div
                class="analysis-result"
                id="analysis-result"
                hidden
            >

                <div class="analysis-summary">

                    <div class="summary-item">
                        <span>학습 일수</span>
                        <strong id="summary-days">0일</strong>
                    </div>

                    <div class="summary-item">
                        <span>총 학습 시간</span>
                        <strong id="summary-hours">0시간</strong>
                    </div>

                    <div class="summary-item">
                        <span>완료 항목</span>
                        <strong id="summary-tasks">0개</strong>
                    </div>

                </div>

                <div class="analysis-message">

                    <p class="hero-label">
                        AI STUDY COACH
                    </p>

                    <h2 id="analysis-title">
                        잘하고 있습니다.
                    </h2>

                    <p id="analysis-description">
                        꾸준한 학습을 이어가고 있습니다.
                    </p>

                </div>

            </div>

        </div>
    </section>

</main>

<footer class="footer">
    <div class="container">
        <p>© 2026 AI Study Coach</p>
    </div>
</footer>

<script src="js/analysis.js"></script>


</body>
</html>
