<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI 코치 | AI Study Coach</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="header">
    <nav class="nav container">

        <a href="index.html" class="logo">
            AI Study Coach
        </a>

        <div class="nav-menu">
            <a href="index.html" class="nav-link">홈</a>
            <a href="plan.html" class="nav-link">학습 계획</a>
            <a href="coach.html" class="nav-link active">AI 코치</a>
            <a href="analysis.html" class="nav-link">학습 분석</a>
        </div>

    </nav>
</header>

<main>

    <section class="page-hero">
        <div class="container">

            <p class="hero-label">
                AI STUDY COACH
            </p>

            <h1>
                공부하다 막히면<br>
                AI 코치에게 물어보세요.
            </h1>

            <p>
                학습 중 궁금한 내용을 질문하면<br>
                AI가 이해하기 쉽게 설명해드립니다.
            </p>

        </div>
    </section>

    <section class="coach-section">
        <div class="container">

            <div class="coach-card">

                <div class="card-title">
                    <h2>AI 코치에게 질문하기</h2>

                    <p>
                        공부하면서 궁금했던 내용을 자유롭게 입력해주세요.
                    </p>
                </div>

                <form id="coach-form">

                    <div class="form-group">
                        <label for="question">
                            질문
                        </label>

                        <textarea
                            id="question"
                            name="question"
                            rows="6"
                            placeholder="예: Python에서 리스트와 튜플의 차이를 쉽게 설명해주세요."
                            required
                        ></textarea>
                    </div>

                    <div
                        id="coach-error"
                        class="form-message error"
                        hidden
                    >
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary coach-submit"
                    >
                        AI에게 질문하기
                    </button>

                </form>

            </div>

            <div class="coach-result-card">

                <div
                    class="result-empty"
                    id="coach-empty"
                >

                    <div class="result-icon">
                        🤖
                    </div>

                    <h2>
                        AI 코치의 답변
                    </h2>

                    <p>
                        질문을 입력하면<br>
                        AI 코치가 답변해드립니다.
                    </p>

                </div>

                <div
                    class="result-loading"
                    id="coach-loading"
                    hidden
                >

                    <div class="loading-icon">
                        ⏳
                    </div>

                    <h2>
                        AI 코치가 답변을 작성하고 있습니다.
                    </h2>

                    <p>
                        잠시만 기다려주세요.
                    </p>

                </div>

                <div
                    class="result-content"
                    id="coach-content"
                    hidden
                >

                    <h2>
                        AI 코치의 답변
                    </h2>

                    <div id="coach-output">
                    </div>

                </div>

            </div>

        </div>
    </section>

</main>

<footer class="footer">
    <div class="container">
        <p>© 2026 AI Study Coach</p>
    </div>
</footer>

<script src="js/coach.js"></script>

</body>
</html>
